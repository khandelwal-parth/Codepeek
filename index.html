<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodePeek — Live Web Inspector & Cloner</title>
  <style>
    :root {
      --bg-dark: #0d1117;
      --bg-panel: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --accent-blue: #58a6ff;
      --accent-green: #238636;
      --danger: #da3633;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Control Bar */
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .url-form {
      flex: 1;
      max-width: 650px;
      display: flex;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .url-input:focus { border-color: var(--accent-blue); }

    .btn {
      background: var(--accent-green);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover { opacity: 0.9; }

    .stats-bar {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: monospace;
    }

    .stat-badge { color: var(--accent-blue); }

    /* Main Workspace */
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Code View Panel */
    .code-panel {
      width: 40%;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.2);
    }

    .tabs { display: flex; gap: 4px; }
    .tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    .tab.active { background: var(--border-color); color: #fff; }

    .code-content {
      flex: 1;
      padding: 12px;
      overflow: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.5;
      color: #e6edf3;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Live Preview Panel */
    .preview-panel {
      flex: 1;
      background: #000;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .preview-frame-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #fff;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Status Bar */
    .status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(22, 27, 34, 0.9);
      padding: 16px 24px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 13px;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚡ CodePeek</div>
    
    <div class="url-form">
      <input type="text" id="urlInput" class="url-input" placeholder="https://example.com" />
      <button class="btn" onclick="fetchSite()">Analyze & Clone</button>
    </div>

    <div class="stats-bar" id="statsBar">
      Lines: <span class="stat-badge" id="statLines">0</span> |
      Size: <span class="stat-badge" id="statSize">0 KB</span>
    </div>
  </header>

  <main>
    <!-- Left: Code Inspector -->
    <section class="code-panel">
      <div class="panel-header">
        <div class="tabs">
          <button class="tab active" onclick="switchTab('full')">Full HTML</button>
          <button class="tab" onclick="switchTab('head')">Head</button>
          <button class="tab" onclick="switchTab('body')">Body</button>
        </div>
        <button class="tab" onclick="copyCode()">Copy Code</button>
      </div>
      <div class="code-content">
        <pre><code id="codeViewer">// Extracted code will render here...</code></pre>
      </div>
    </section>

    <!-- Right: Sandbox Live Preview -->
    <section class="preview-panel">
      <div class="status-overlay" id="statusOverlay">Processing site rendering...</div>
      <div class="preview-frame-container">
        <iframe 
          id="previewFrame" 
          title="CodePeek Live Render"
          sandbox="allow-scripts allow-forms allow-popups allow-modals"
        ></iframe>
      </div>
    </section>
  </main>

  <script>
    let currentCode = "";
    let parsedDoc = null;

    async function fetchSite() {
      const urlInput = document.getElementById("urlInput").value.trim();
      const codeViewer = document.getElementById("codeViewer");
      const statusOverlay = document.getElementById("statusOverlay");

      if (!urlInput) return alert("Enter a valid URL");

      statusOverlay.style.display = "block";
      statusOverlay.innerText = "Extracting DOM and converting canvas elements...";
      codeViewer.innerText = "// Fetching live snapshot...";

      try {
        const response = await fetch(`/api/render?url=${encodeURIComponent(urlInput)}`);
        const data = await response.json();

        if (data.error) throw new Error(data.error);

        currentCode = data.html;
        
        // Parse doc for tab navigation
        const parser = new DOMParser();
        parsedDoc = parser.parseFromString(currentCode, "text/html");

        updateStats(currentCode);
        displayTab('full');
        updatePreview();
      } catch (err) {
        codeViewer.innerText = "// Error: " + err.message;
        alert("Failed to render page: " + err.message);
      } finally {
        statusOverlay.style.display = "none";
      }
    }

    function updateStats(code) {
      const lines = code.split('\n').length;
      const sizeKB = (new Blob([code]).size / 1024).toFixed(1);
      document.getElementById("statLines").innerText = lines.toLocaleString();
      document.getElementById("statSize").innerText = `${sizeKB} KB`;
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      displayTab(tabName);
    }

    function displayTab(tabName) {
      const codeViewer = document.getElementById("codeViewer");
      if (!currentCode) return;

      if (tabName === 'head' && parsedDoc) {
        codeViewer.innerText = parsedDoc.head ? parsedDoc.head.innerHTML : "";
      } else if (tabName === 'body' && parsedDoc) {
        codeViewer.innerText = parsedDoc.body ? parsedDoc.body.innerHTML : "";
      } else {
        codeViewer.innerText = currentCode;
      }
    }

    function updatePreview() {
      const previewFrame = document.getElementById("previewFrame");
      if (!previewFrame) return;

      // Injected interceptor to handle form submits and navigation toast
      const previewGuardScript = `
        <script>
          document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('form').forEach(form => {
              form.addEventListener('submit', e => e.preventDefault());
            });

            document.querySelectorAll('a').forEach(anchor => {
              anchor.addEventListener('click', (e) => {
                e.preventDefault();
                const href = anchor.getAttribute('href');
                
                let toast = document.getElementById('codepeek-toast');
                if (!toast) {
                  toast = document.createElement('div');
                  toast.id = 'codepeek-toast';
                  toast.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#f8fafc;padding:10px 18px;border-radius:20px;z-index:999999;font-size:12px;font-family:sans-serif;box-shadow:0 10px 15px -3px rgba(0,0,0,0.3);';
                  document.body.appendChild(toast);
                }
                toast.innerText = 'Navigation disabled in preview: ' + (href || '#');
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2500);
              });
            });
          });
        <\/script>
      `;

      let cleanCode = currentCode || "";

      if (cleanCode.includes("</head>")) {
        cleanCode = cleanCode.replace("</head>", `${previewGuardScript}</head>`);
      } else {
        cleanCode = previewGuardScript + cleanCode;
      }

      previewFrame.srcdoc = cleanCode;
    }

    function copyCode() {
      if (!currentCode) return alert("Nothing to copy!");
      navigator.clipboard.writeText(currentCode);
      alert("HTML copied to clipboard!");
    }
  </script>
</body>
</html>
